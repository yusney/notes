[package]
name = "client"
version = "0.3.7"
description = "Notes - Gestor de Conocimiento Personal"
authors = ["Yusney Martínez Duque"]
homepage = "https://donduque.dev/"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Default — NO Tauri features enabled. Cargo features are additive and
# cannot be removed once added to the base, so any platform-only feature
# (`tray-icon`, `devtools`) must be declared in a per-target `dependencies`
# block below. Putting them on the base would leak them into Android
# builds (audit #2317): `devtools` enables the WebView inspector in
# production APK/AAB, and `tray-icon` is compiled on mobile where there
# is no system tray.
#
# Bumped Tauri 2 → 2.11 to pull in the fix for the Android JNI panic
# (tao 0.35.2 ndk_glue NullPtr on Rust_onActivityCreate) that crashed
# the activity when the OAuth callback deep link was delivered.
# Verified fix exists in tao >= 0.36 (pulled by tauri 2.11+).
# Plugins are kept on the 2.x stable line — `tauri-plugin-deep-link`
# has no 2.11 release (latest is 2.4.9) but the bug is in `tao` core,
# not the plugin, so the plugin version doesn't matter for the fix.
tauri = { version = "2.11", features = ["tray-icon"] }
tauri-plugin-stronghold = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only Tauri features — declared per-target so Android/iOS
# builds don't inherit them. `devtools` is a debug-only WebView
# inspector and MUST NOT ship in production mobile builds.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Stronghold's key derivation (Argon2-based) is CPU-bound and runs fully
# unoptimized in a plain `cargo build`/`tauri dev`, turning a sub-second
# vault init into a ~60s IPC-blocking stall on cold boot (WebView2 "force
# close or wait" ANR). Optimizing only *dependencies* (not our own crate)
# keeps `cargo build` incremental rebuilds fast for app code while making
# crypto-heavy deps like `iota_stronghold` run at release speed.
[profile.dev.package."*"]
opt-level = 3
