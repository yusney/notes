[package]
name = "desktop"
version = "0.3.7"
description = "Notes - Gestor de Conocimiento Personal"
authors = ["Yusney Martínez Duque"]
homepage = "https://donduque.dev/"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Default — no desktop-only features. The tray-icon feature is added back
# per-target below so it is compiled out on Android.
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-stronghold = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Desktop-only: re-declare tauri with the tray-icon feature.
# Cargo features are additive — once declared, they cannot be retroactively
# removed from a single target, so the cleanest gate is a per-target re-decl.
[target.'cfg(not(target_os = "android"))'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }

[target."cfg(any(target_os = \"macos\", windows, target_os = \"linux\"))".dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

# Stronghold's key derivation (Argon2-based) is CPU-bound and runs fully
# unoptimized in a plain `cargo build`/`tauri dev`, turning a sub-second
# vault init into a ~60s IPC-blocking stall on cold boot (WebView2 "force
# close or wait" ANR). Optimizing only *dependencies* (not our own crate)
# keeps `cargo build` incremental rebuilds fast for app code while making
# crypto-heavy deps like `iota_stronghold` run at release speed.
[profile.dev.package."*"]
opt-level = 3
