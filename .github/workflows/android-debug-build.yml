name: Android Debug APK (manual download)

# Builds the unsigned debug APK for every push to `main` and uploads it as
# a 90-day workflow artifact. Designed so the maintainer can download the
# latest build quickly without needing a Play Console or upload keystore.
#
# For signed release AABs, see release.yml (tag-gated, requires
# ANDROID_KEY_* secrets).

on:
  push:
    branches: [main]
  workflow_dispatch:

# Cancel any in-flight build for the same SHA so retag pipelines don't
# double-spend CI minutes.
concurrency:
  group: android-debug-build-${{ github.sha }}
  cancel-in-progress: true

jobs:
  android-debug:
    name: Build Android Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VITE_API_BASE_URL: "https://notes-api.donduque.dev"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/client/pnpm-lock.yaml

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK (manual)
        env:
          ANDROID_HOME: ${{ github.workspace }}/.android-sdk
        # Replaces `android-actions/setup-android@v3` which has a known
        # bug parsing `packages:` as a multiline string (sdkmanager gets
        # one concatenated package id with literal newlines instead of
        # four separate ids). The `tauri-android.yml` workflow hits the
        # same bug — fix both when upgrading the action version.
        run: |
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          cd "$ANDROID_HOME/cmdline-tools"
          if [ ! -d "latest" ]; then
            echo "Downloading Android cmdline-tools 11076708..."
            curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -o cmdline.zip
            unzip -q cmdline.zip
            mv cmdline-tools latest
            rm cmdline.zip
          fi
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$PATH"
          yes 2>/dev/null | sdkmanager --licenses > /dev/null
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools" "ndk;26.1.10909125"

      - name: Install Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/client/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/client
        run: pnpm install --frozen-lockfile

      - name: Initialize Android target (idempotent)
        working-directory: apps/client
        # `tauri android init --ci` materializes `src-tauri/gen/android/` on
        # fresh checkouts. Safe to re-run — existing files are kept.
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci
          fi

      - name: Build debug APK
        working-directory: apps/client
        # `--debug` produces an APK signed with Android's auto-generated
        # debug keystore (per-developer). Installable on any device after
        # the user accepts "Install from unknown sources". Not for
        # distribution — see release.yml for the signed release AAB.
        run: pnpm tauri android build --debug

      - name: Patch OAuth callback deep-link intent-filter
        working-directory: apps/client
        # tauri-plugin-deep-link v2.6.1 only emits `http`/`https` schemes
        # in the auto-generated intent-filter, so the Notes backend's
        # `notes://auth.callback?code=...` redirect lands on "no app to
        # handle this URL" and the screen sits waiting. The patch adds a
        # `<data android:scheme="notes" />` to the same filter that
        # already captures the OAuth callback host. Idempotent.
        run: python3 ../../scripts/patch-android-deep-link.py

      - name: Locate debug APKs
        id: apks
        working-directory: apps/client
        # Tauri 2.6+ emits a single universal APK at
        # `outputs/apk/universal/debug/app-universal-debug.apk` (NOT the
        # `outputs/apk/debug/` path shown in older docs). The previous
        # workflow pointed at the older path and silently produced an
        # empty artifact.
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/debug"
          ls -1 "$APK_DIR"/*.apk | tee apk-paths.txt

      - name: Upload debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: notes-android-debug-apk
          # IMPORTANT: glob the *.apk files directly. The previous version
          # uploaded `apk-paths.txt` (a text file with paths to the APKs)
          # which produced an artifact containing only that text file — no
          # APKs at all. Glob captures all APKs in one upload.
          path: apps/client/src-tauri/gen/android/app/build/outputs/apk/universal/debug/*.apk
          if-no-files-found: error
          retention-days: 90

      - name: Print SHA256 sums
        working-directory: apps/client
        # Convenience for verifying download integrity before sideloading.
        run: |
          APK_DIR="src-tauri/gen/android/app/build/outputs/apk/universal/debug"
          echo "## APK SHA256 sums" >> $GITHUB_STEP_SUMMARY
          for apk in "$APK_DIR"/*.apk; do
            sha256sum "$apk"
          done | tee -a $GITHUB_STEP_SUMMARY
