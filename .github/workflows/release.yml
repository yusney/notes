name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore notes.slnx
      - run: dotnet build notes.slnx --no-restore -c Release
      - run: dotnet test notes.slnx --no-build -c Release --verbosity normal

  test-frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/client
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/client/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm exec vitest run

  build-tauri:
    name: Build (${{ matrix.platform }})
    needs: [test-backend, test-frontend]
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
            args: ""
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/client/pnpm-lock.yaml

      - uses: dtolnay/rust-toolchain@stable
        with:
          # universal binary needs both Apple targets
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/client/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/client
        run: pnpm install --frozen-lockfile

      - name: Install Linux system dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            pkg-config

      - name: Build and upload to release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_BASE_URL: "https://notes-api.donduque.dev"
          APPLE_SIGNING_IDENTITY: "-"
        with:
          projectPath: apps/client
          tagName: ${{ github.ref_name }}
          releaseName: "${{ github.ref_name }}"
          releaseBody: "See the release notes below."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

  # ── Android: signed release AAB ─────────────────────────────────────────────
  # Builds the Android App Bundle (.aab) signed with the upload keystore
  # (configured via GitHub Secrets ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD,
  # ANDROID_KEY_BASE64). Attaches the .aab to the same GitHub Release draft
  # that tauri-action created for the desktop binaries, so a single tagged
  # release carries all platform artifacts. The first upload to Google Play
  # is still manual — see RELEASING.md (out of scope for this workflow).
  build-android:
    name: Build Android AAB
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      VITE_API_BASE_URL: "https://notes-api.donduque.dev"
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with: { version: 10 }

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: apps/client/pnpm-lock.yaml

      - uses: actions/setup-java@v4
        with: { distribution: "temurin", java-version: "17" }

      - uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-34
            build-tools;34.0.0
            platform-tools
            ndk;26.1.10909125
          cmdline-tools: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/client/src-tauri -> target"

      - name: Install frontend dependencies
        working-directory: apps/client
        run: pnpm install --frozen-lockfile

      - name: Initialize Android target (idempotent)
        working-directory: apps/client
        run: |
          if [ ! -d src-tauri/gen/android ]; then
            pnpm tauri android init --ci
          else
            echo "Android target already initialized — skipping tauri android init."
          fi

      - name: Apply release signing config to build.gradle.kts
        working-directory: apps/client
        # `tauri android init` regenerates `gen/android/`, which wipes any
        # signing config we previously committed. This script is idempotent —
        # it no-ops if the signing block is already present. See
        # scripts/setup-android-signing.py for the regex work.
        run: python3 ../../scripts/setup-android-signing.py

      - name: Setup Android keystore
        working-directory: apps/client/src-tauri/gen/android
        # Secrets required:
        #   ANDROID_KEY_ALIAS    - alias used when generating the keystore (e.g. "upload")
        #   ANDROID_KEY_PASSWORD - password set on the keystore
        #   ANDROID_KEY_BASE64   - base64-encoded contents of upload-keystore.jks
        #                         (`base64 -i upload-keystore.jks`)
        run: |
          echo "keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}" > keystore.properties
          echo "password=${{ secrets.ANDROID_KEY_PASSWORD }}" >> keystore.properties
          base64 -d <<< "${{ secrets.ANDROID_KEY_BASE64 }}" > $RUNNER_TEMP/keystore.jks
          echo "storeFile=$RUNNER_TEMP/keystore.jks" >> keystore.properties

      - name: Build release AAB
        working-directory: apps/client
        run: pnpm tauri android build -- --aab

      - name: Upload AAB as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: notes-android-release-aab
          path: apps/client/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab
          if-no-files-found: error
          retention-days: 90

      - name: Attach AAB to GitHub Release draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # tauri-action created the draft release; this appends the AAB so a
        # single tagged release carries all platform artifacts.
        run: |
          gh release upload "${{ github.ref_name }}" \
            "apps/client/src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab" \
            --clobber
