name: "Issue Triage & Enhancement"

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Permitido editar y etiquetar el issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TODO: Integrar IA real (OpenAI, GitHub Models, etc.) cuando haya API key disponible.
      # El action github/ai-actions/chat@v1 no existe. Mientras tanto, hacemos triage por keywords.
      - name: Keyword-based triage
        id: triage
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const title = (context.payload.issue.title || "").toLowerCase();
            const body = (context.payload.issue.body || "").toLowerCase();
            const combined = title + " " + body;

            // Detectar idioma simple (si hay muchas palabras en español, lo marcamos)
            const spanishWords = ["error", "bug", "problema", "falla", "fallo", "no funciona", "crash"];
            const isSpanish = spanishWords.some(w => combined.includes(w));

            // Clasificación por keywords
            let label = "problem";
            if (
              /\b(bug|fix|error|crash|broken|falla|fallo|no funciona|excepción|exception)\b/.test(combined)
            ) {
              label = "bug";
            } else if (
              /\b(feature|enhancement|add|nuevo|implementar|support|mejorar|propuesta)\b/.test(combined)
            ) {
              label = "enhancement";
            } else if (
              /\b(problem|question|duda|config|setup|instalación|deploy)\b/.test(combined)
            ) {
              label = "problem";
            }

            core.setOutput("label", label);
            core.setOutput("is_spanish", isSpanish ? "true" : "false");

      - name: Label issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const label = `${{ steps.triage.outputs.label }}`;
            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            await github.rest.issues.addLabels({
              owner,
              repo,
              issue_number: issueNumber,
              labels: [label, "pending-approval"],
            });

            // Comentario informativo
            const isSpanish = `${{ steps.triage.outputs.is_spanish }}` === "true";
            const langNote = isSpanish
              ? "\n\n> Se detectó español en el issue. Cuando la integración con IA esté activa, se traducirá automáticamente al inglés."
              : "";

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `🤖 Triage automático aplicado.\n\n- **Clasificación:** \`${label}\`\n- **Estado:** pendiente de aprobación del equipo.${langNote}\n\n---\n*Workflow de triage en modo keyword (sin IA) hasta que se configure una API key de OpenAI/GitHub Models.*`,
            });
