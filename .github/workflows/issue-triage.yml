name: "Issue Triage & Translation"

on:
  issues:
    types: [opened]

jobs:
  triage:
    runs-on: ubuntu-latest
    permissions:
      issues: write # Permitido editar y etiquetar el issue

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Process Issue with GitHub Models AI
        id: ai_analysis
        uses: github/ai-actions/chat@v1
        with:
          # Usamos GPT-4o disponible de forma gratuita para flujos de trabajo de GitHub
          model: gpt-4o
          github-token: ${{ secrets.GITHUB_TOKEN }}
          response-format: json
          system-prompt: |
            You are an expert repository maintainer and triage assistant.
            Your job is to analyze incoming issues, translate them to English if necessary, classify them, and format them cleanly.
          prompt: |
            Analyze the following GitHub Issue:
            Title: ${{ github.event.issue.title }}
            Body: ${{ github.event.issue.body }}

            Tasks to execute:
            1. Language: If the Title or Body is not in English, translate them to English. Keep technical terms, code blocks, and logs intact.
            2. Classification: Categorize the issue strictly into ONE of these labels: "bug", "enhancement" (use this for new features/implementations), or "problem".
            3. Formatting: Structure the body cleanly using professional Markdown with these exact sections:
               - ## Description
               - ## Context / Steps to Reproduce
               - ## Expected Behavior

            You must respond ONLY with a valid JSON object matching this schema:
            {
              "translated_title": "string",
              "structured_body": "string",
              "label": "bug" | "enhancement" | "problem"
            }

      - name: Update and Label Issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Parseamos la respuesta JSON que nos devolvió el paso de la IA
            const aiResult = JSON.parse(`${{ steps.ai_analysis.outputs.response }}`);

            const issueNumber = context.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            // 1. Actualizamos el Issue con el título traducido y el cuerpo estructurado
            await github.rest.issues.update({
              owner: owner,
              repo: repo,
              issue_number: issueNumber,
              title: aiResult.translated_title,
              body: aiResult.structured_body + "\n\n---\n*🤖 Automated triage and translation powered by AI.*"
            });

            // 2. Le añadimos la etiqueta de clasificación y tu etiqueta de control
            await github.rest.issues.addLabels({
              owner: owner,
              repo: repo,
              issue_number: issueNumber,
              labels: [aiResult.label, 'pending-approval']
            });
